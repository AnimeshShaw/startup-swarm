name: CI
on:
  push: {branches: [main]}
  pull_request:
permissions:
  contents: read
jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        python: ["3.9", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "${{ matrix.python }}"}
      - run: python -m unittest discover -s tests -v
  generated-files:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python build.py
      - name: Generated files must be committed
        run: git diff --exit-code && test -z "$(git status --porcelain)"
  windows:
    runs-on: windows-latest
    continue-on-error: true   # Windows is not yet a supported platform
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v7
        with: {python-version: "3.12"}
      - run: python -m unittest discover -s tests -v
